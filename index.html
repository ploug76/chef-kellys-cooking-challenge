// ---------------------------------------------------------------- carousel helpers
const RING_T=1.7;
// playfield rect in grid coords (grids are authored 9x8; padded into 13x9 with void until the engine sizes grids per level)
const car_box=()=>({ox:G.L.car_ox||0,oy:G.L.car_oy||0,w:G.L.car_w||G.L.g[0].length,h:G.L.car_h||G.L.g.length});
function car_ringOrder(G){const ring=G.tiles.filter(t=>t.t==='car_ring');if(!ring.length)return[];const set=new Set(ring);
 const st=ring.slice().sort((a,b)=>a.y-b.y||a.x-b.x)[0],out=[st],seen=new Set([st]);let c=st;
 for(let k=0;k<ring.length;k++){let nx=null;for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){const n=tileAt(c.x+dx,c.y+dy);if(n&&set.has(n)&&!seen.has(n)){nx=n;break}}if(!nx)break;out.push(nx);seen.add(nx);c=nx}return out}
function car_ringFrac(){const ph=G.ext.rph||0;if(ph<.62)return 0;const k=(ph-.62)/.38;return k*k*(3-2*k)}
function car_ringItems(t,s,time){const ring=G.ext.ring;if(!ring||!ring.length)return;const n=ring.length,f=car_ringFrac(),L=s*.18,idx=q=>q.y*100+q.x;
 for(let i=0;i<n;i++){const a=ring[i];if(!a.ci)continue;const b=ring[(i+1)%n];const owner=f>0?(idx(a)>idx(b)?a:b):a;if(owner!==t)continue;
  const px=a.x+(b.x-a.x)*f,py=a.y+(b.y-a.y)*f,bob=Math.sin(time*4+i)*s*.03;drawItem(a.ci,KX+px*s+s/2,KY+py*s+s/2-L-bob,s,false,time)}}
function car_ringTick(G,dt){const ring=G.ext.ring;if(!ring||ring.length<2)return;for(const t of ring)if(t.fire>0){t.fire=0;t.fs=0}
 G.ext.rph=(G.ext.rph||0)+dt/RING_T;if(G.ext.rph>=1){G.ext.rph=0;const items=ring.map(t=>t.ci);ring.forEach((t,i)=>{t.ci=items[(i-1+ring.length)%ring.length]})}}
// ---------------------------------------------------------------- level mechanics
function car_init(G){G.ext.ring=car_ringOrder(G);G.ext.rph=0;
 // counters that touch no floor become booth posts (nothing can be put there, and a fire there would be out of reach)
 for(const t of G.tiles){if(t.t!=='counter'||t.it)continue;if(!DIRS.some(d=>walkable(tileAt(t.x+d[0],t.y+d[1]))))t.t='wall'}
 const L=G.L;if(L.wind)G.ext.wind={t:L.wind.first||7,ph:'calm',dir:1,warn:0,g:0};if(L.carts)G.ext.carts={list:[],t:L.carts.first||3,k:0,bumpT:0};
 G.ext.lamps=(L.lamps||[]).map(p=>({x:p[0]+(L.car_ox||0),y:p[1]+(L.car_oy||0)}))}
function car_wind(G,dt){const W=G.ext.wind,cfg=G.L.wind;if(!W)return;
 if(W.ph==='calm'){W.t-=dt;if(W.t<1.6&&!W.warn){W.warn=1;W.dir=rnd()<.5?-1:1;msg(W.dir>0?'💨 Gust → coming!':'💨 ← Gust coming!',6.5,1.2,'#bfe9ff');sfx('slide')}
  if(W.t<=0){W.ph='gust';W.g=cfg.dur||1.6;sfx('spray')}}
 else{W.g-=dt;const P=G.P;P.vx+=W.dir*(cfg.force||36)*dt;
  for(const c of G.sous){const nx=c.x+W.dir*.5*dt;if(walkable(tileAt(Math.floor(nx+W.dir*.3),Math.floor(c.y))))c.x=nx}
  if(rnd()<.5){const b=car_box();G.parts.push({x:W.dir>0?b.ox-.2:b.ox+b.w+.2,y:b.oy+.5+rnd()*(b.h-1),vx:W.dir*(7+rnd()*3),vy:(rnd()-.5),t:0,life:2,col:['#ffd23a','#ff7a3d','#5cc94a','#ff9ccf'][Math.floor(rnd()*4)],r:.06,fire:1})}
  if(W.g<=0){W.ph='calm';W.warn=0;W.t=(cfg.every||9)+rnd()*4}}}
function car_carts(G,dt){const C=G.ext.carts,cfg=G.L.carts;if(!C)return;const P=G.P;C.bumpT-=dt;
 const b=car_box();C.t-=dt;if(C.t<=0){const row=cfg.rows[C.k%cfg.rows.length]+b.oy,dir=(C.k%2)?-1:1;C.k++;C.list.push({x:dir>0?b.ox-1.2:b.ox+b.w+1.2,y:row+.5,dir,sp:cfg.speed||1.25,kind:Math.floor(rnd()*3),seed:rnd()*6});C.t=(cfg.every||7)+rnd()*3}
 for(const c of C.list){c.x+=c.dir*c.sp*dt;const dx=P.x-c.x,dy=P.y-c.y;
  if(Math.abs(dx)<.9&&Math.abs(dy)<.62){let sy=dy>=0?1:-1;const tx=Math.floor(P.x),ty=Math.floor(P.y);if(!walkable(tileAt(tx,ty+sy))&&walkable(tileAt(tx,ty-sy)))sy=-sy;
   P.vy+=sy*30*dt;P.vx+=c.dir*8*dt;if(C.bumpT<=0){C.bumpT=2.5;msg(['Coming through!','Excuse us!','Beep beep!','Pardon me!'][Math.floor(rnd()*4)],c.x,c.y-1.1,'#fff');sfx('bonk')}}}
 C.list=C.list.filter(c=>c.x>b.ox-2&&c.x<b.ox+b.w+2)}
// an idle sous chef parked on the only spot in front of a station can wedge Kelly: after a moment he steps aside
function car_awayPath(G,c,thru){const P=G.P,sx=Math.floor(c.x),sy=Math.floor(c.y),key=(x,y)=>y*100+x,prev=new Map([[key(sx,sy),-1]]),q=[[sx,sy]],block=new Set(thru?[]:[key(Math.floor(P.x),Math.floor(P.y))]);
 G.sous.forEach(o=>{if(o!==c)block.add(key(Math.floor(o.x),Math.floor(o.y)))});
 while(q.length){const [x,y]=q.shift();if(Math.hypot(x+.5-P.x,y+.5-P.y)>=2.1&&!block.has(key(x,y))){const path=[];let k=key(x,y);while(k!==key(sx,sy)){path.unshift({x:k%100,y:(k/100)|0});k=prev.get(k)}return path}
  for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,nk=key(nx,ny);if(prev.has(nk)||block.has(nk)||!walkable(tileAt(nx,ny)))continue;prev.set(nk,key(x,y));q.push([nx,ny])}}return null}
// sous hops around Kelly (an arc that keeps >=0.62 away, so the engine never shoves her) to the free tile behind her
function car_hop(G,c){const P=G.P;let ux=c.x-P.x,uy=c.y-P.y;const d=Math.hypot(ux,uy)||1;ux/=d;uy/=d;
 const occ=(x,y)=>G.sous.some(o=>o!==c&&Math.floor(o.x)===x&&Math.floor(o.y)===y);let tgt=null;
 for(const k of [1,1.5,2]){const x=Math.floor(P.x-ux*k),y=Math.floor(P.y-uy*k);if(walkable(tileAt(x,y))&&!occ(x,y)&&Math.hypot(x+.5-P.x,y+.5-P.y)>.62){tgt={x,y};break}}
 if(!tgt)return false;const a0=Math.atan2(uy,ux),side=(Math.floor(G.t*7)%2)?1:-1,R=Math.max(.64,d);c.idle=null;c.task='tidy';c.bump=0;
 say(c,['Squeeze by!','Hop!','Behind you, Chef!'][c.i%3]);
 c.gen=(function*(){let k=0;const N=Math.max(6,Math.round(.3/(G.dt||1/60)));for(k=1;k<=N;k++){const a=a0+side*Math.PI*k/N;c.x=G.P.x+Math.cos(a)*R;c.y=G.P.y+Math.sin(a)*R;c.moving=true;c.walk+=.2;yield}
  let n=0;while(!sousStep(c,tgt.x,tgt.y,G.dt)&&n++<120)yield;c.moving=false})();return true}
function car_unblock(G,dt){const P=G.P,v=Math.hypot(P.vx||0,P.vy||0);for(const c of G.sous){if(c.gen||c.task||c.stun>0){c.car_b=0;c.car_p=0;continue}
 const dx=c.x-P.x,dy=c.y-P.y,d=Math.hypot(dx,dy);
 // Kelly walking into an idle sous: he gets out of the way fast
 const press=d<.95&&v>1&&((P.vx||0)*dx+(P.vy||0)*dy)/(v*(d||1))>.55;c.car_p=press?(c.car_p||0)+dt:0;
 c.car_b=d<1.05?(c.car_b||0)+dt:0;
 if(c.car_p>.25||c.car_b>.7){const pressed=c.car_p>.25;c.car_b=0;c.car_p=0;let path=pressed?null:car_awayPath(G,c);
  if(pressed){const pth=car_awayPath(G,c);// a side step that doesn't pass in front of Kelly's walking direction
   if(pth&&pth.length){const e=pth[pth.length-1],ex=e.x+.5-P.x,ey=e.y+.5-P.y;if((P.vx*ex+P.vy*ey)<=0||Math.abs(P.vx*ey-P.vy*ex)/v>.9)path=pth}}
  if(path&&path.length){c.idle=null;c.task='tidy';c.bump=0;c.bumped=0;c.gen=(function*(){for(const p of path){let k=0;while(!sousStep(c,p.x,p.y,G.dt)&&k++<150)yield}c.moving=false})()}
  else car_hop(G,c)}}}
function car_tick(G,dt){car_ringTick(G,dt);car_wind(G,dt);car_carts(G,dt);car_unblock(G,dt)}
